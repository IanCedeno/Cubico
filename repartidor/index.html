<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repartidor | CÚBICO</title>
  <link rel="stylesheet" href="/assets/portal.css">
  <style>
    .delivery-list { display:flex; flex-direction:column; gap:12px; }

    .delivery-card { background:var(--paper); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
    .delivery-card summary { list-style:none; padding:18px 22px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .delivery-card summary::-webkit-details-marker { display:none; }
    .delivery-card[open] summary { border-bottom:1px solid var(--line); }

    .pkg-main { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
    .pkg-tracking { font-size:12px; color:var(--muted); font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
    .pkg-client { font-size:17px; font-weight:700; color:var(--ink); overflow-wrap:anywhere; }
    .pkg-phone { font-size:14px; color:var(--muted); }

    .pkg-badge { font-size:12px; font-weight:700; background:#f5f0e6; color:#8a6a2a; border-radius:8px; padding:5px 12px; white-space:nowrap; flex-shrink:0; }
    .pkg-badge.entregado { background:#e8f5e9; color:#2e7d32; }

    .pkg-detail { padding:20px 22px; }
    .pkg-detail table { width:100%; border-collapse:collapse; margin-bottom:18px; }
    .pkg-detail td { padding:7px 0; font-size:14px; border-bottom:1px solid var(--line); vertical-align:top; }
    .pkg-detail td:first-child { color:var(--muted); width:150px; font-weight:500; }

    .btn-deliver { display:block; width:100%; padding:13px; background:var(--black); color:var(--gold); border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:0.5px; transition:opacity .15s; }
    .btn-deliver:disabled { opacity:.45; cursor:not-allowed; }
    .delivered-tag { display:block; text-align:center; padding:12px; background:#e8f5e9; color:#2e7d32; border-radius:12px; font-size:14px; font-weight:700; }

    .pkg-empty { text-align:center; padding:64px 24px; color:var(--muted); font-size:16px; }
  </style>
</head>
<body class="portal-body" data-page="repartidor">

  <header class="portal-top">
    <a class="portal-logo" href="/">
      <img src="/assets/logo-cubico.svg" alt="CÚBICO">
    </a>
    <div class="portal-actions">
      <button id="logout" class="btn ghost" type="button" style="color:#fff;border-color:#333">Salir</button>
    </div>
  </header>

  <main class="portal-shell" hidden>
    <div class="dashboard" style="display:block;max-width:760px;margin:0 auto">

      <div class="dash-head" style="margin-bottom:24px">
        <div>
          <div class="eyebrow">Portal de entrega</div>
          <h1 class="portal-title" style="font-size:38px">Paquetes por entregar</h1>
        </div>
      </div>

      <div id="filterBar" style="display:none;margin-bottom:18px">
        <div style="position:relative">
          <select id="clientFilter" style="width:100%;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 44px 13px 16px;font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none">
            <option value="">Todos los clientes</option>
          </select>
          <span style="position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:20px">⌄</span>
        </div>
      </div>

      <div id="deliveryList" class="delivery-list">
        <div class="delivery-card" style="padding:20px 22px"><span class="sk" style="width:60%;height:16px"></span><br><br><span class="sk" style="width:40%"></span></div>
        <div class="delivery-card" style="padding:20px 22px"><span class="sk" style="width:55%;height:16px"></span><br><br><span class="sk" style="width:35%"></span></div>
        <div class="delivery-card" style="padding:20px 22px"><span class="sk" style="width:65%;height:16px"></span><br><br><span class="sk" style="width:45%"></span></div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase-config.js"></script>
  <script src="/assets/portal.js"></script>

</body>
</html>
